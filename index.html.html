:root{

}

  --ok:#5FD08F; --ok-soft:#173826; --warn:#F2B35C; --warn-soft:#3A2A12; --off:#B8A7A6; --off-soft:#2C2324;
  --vc:#F0896F; --db:#8DB8E3; --db-soft:#1B2A3A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161112; --surface:#211A1B; --ink:#F4ECEB; --muted:#B8A7A6; --line:#3A2E2F;
  --accent:#F0605A; --on-accent:#1A0E0E; --accent-soft:#3A1F1E; --mast:#5E1406; --mast-ink:#FFFFFF; --mast-muted:#E9BDB4;
  --ok:#5FD08F; --ok-soft:#173826; --warn:#F2B35C; --warn-soft:#3A2A12; --off:#B8A7A6; --off-soft:#2C2324;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Masthead */
.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{padding-block:22px 20px;display:flex;flex-direction:column;gap:10px}
.mast-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mast-muted);font-weight:700}
.mast h1{font-size:clamp(26px,6vw,34px);font-weight:700;line-height:1.1}
.mast p{margin:0;color:var(--mast-muted);max-width:56ch}
.lang{display:inline-flex;border:1.5px solid var(--mast-muted);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:6px 14px;font:700 13px/1 var(--display);color:var(--mast-ink)}
.lang button[aria-pressed="true"]{background:var(--mast-ink);color:var(--mast)}
.countdown{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
.countdown b{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.countdown span{color:var(--mast-muted);font-weight:600}

/* Sections */
section{padding-block:22px 6px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:19px;font-weight:600}
.sec-h small{color:var(--muted);font-size:14px}

/* Key dates */
.dates{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.dates li{position:relative;padding:0 0 14px 20px}
.dates li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.dates li.now::before{background:var(--accent);border-color:var(--accent)}
.dates li.past{color:var(--muted)}
.dates li.past::before{background:var(--line)}
.d-when{font:600 13px/1.2 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.dates li.now .d-when{color:var(--accent)}
.d-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.d-what{margin-top:2px}
.facts{margin:4px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;gap:8px;list-style:none}
.facts li{padding-left:16px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;background:var(--accent);border-radius:2px}

/* Finder bar */
.finder{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.finder .wrap{display:grid;gap:8px}
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:600 14px/1 var(--body);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.toggle[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sep{width:1px;background:var(--line);flex:0 0 1px;margin-inline:2px}

/* Locations */
.area{padding-block:18px 4px}
.area-h{margin-bottom:10px}
.area-h h3{font-size:17px;font-weight:600}
.area-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:grid;gap:6px;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.type{font:700 11px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border-radius:6px}
.type.vc{color:var(--vc);background:var(--accent-soft)}
.type.db{color:var(--db);background:var(--db-soft)}
.status{font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.status.open{color:var(--ok);background:var(--ok-soft)}
.status.soon{color:var(--warn);background:var(--warn-soft)}
.status.closed{color:var(--off);background:var(--off-soft)}
.name{font:600 16px/1.3 var(--display)}
.addr{font-size:15px;user-select:all;-webkit-user-select:all}
.note{font-size:13px;color:var(--muted)}
.hours{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;font:600 14px/1 var(--body);border:1.5px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* County links */
.links{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.link{display:grid;gap:2px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.link b{font:600 15px/1.3 var(--display);color:var(--accent)}
.link span{font-size:14px;color:var(--muted)}
.phones{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft)}
.phones div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phones b{font:600 16px/1 var(--display);font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.phones small{color:var(--muted);font-size:13px}
footer{padding-block:22px 36px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Time helpers (Pacific) ---------- */
function nowPT(){
  var p={};
  new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  return {date:p.year+"-"+p.month+"-"+p.day, mins:(+p.hour)*60+(+p.minute)};
}
function addDay(d,n){var t=new Date(d+"T12:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5);}
function hm(m){var h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM",h12=h%12||12;return h12+(mm?":"+String(mm).padStart(2,"0"):"")+" "+ap;}
var MON={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],es:["ene.","feb.","mar.","abr.","may.","jun.","jul.","ago.","sep.","oct.","nov.","dic."]};
var DOW={en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],es:["dom.","lun.","mar.","mié.","jue.","vie.","sáb."]};
function fmtDate(d,lang){var t=new Date(d+"T12:00:00Z"),w=DOW[lang][t.getUTCDay()],m=MON[lang][t.getUTCMonth()],dd=t.getUTCDate();
  return lang==="es"?(w+" "+dd+" "+m):(w+", "+m+" "+dd);}

/* Status: returns {k: open|soon|closed, text} */
function status(l,now,lang){
  var s=S[lang], d=now.date, m=now.mins;
  if(d>ED||(d===ED&&m>=1200)) return {k:"closed",x:s.over};
  if(l.t==="vc"){
    var start=l.d===11?"2026-10-24":"2026-10-31";
    if(d<start) return {k:"soon",x:s.opensOn(fmtDate(start,lang))};
    var o=d===ED?420:480, c=d===ED?1200:1020;
    if(m<o) return {k:"soon",x:s.openTodayAt(hm(o))};
    if(m>=c) return {k:"closed",x:s.closedTomorrow(hm(addDay(d,1)===ED?420:480))};
    return {k:"open",x:s.openUntil(hm(c))};
  }
  if(d<"2026-10-04") return {k:"soon",x:s.opensOn(fmtDate("2026-10-04",lang))};
  if(l.h==="24") return d===ED?{k:"open",x:s.openUntil("8 PM")}:{k:"open",x:s.open24};
  var oo=l.h[0], cc=d===ED?1200:l.h[1];
  if(m<oo) return {k:"soon",x:s.openTodayAt(hm(oo))};
  if(m>=cc) return {k:"closed",x:s.closedTomorrow(hm(oo))};
  return {k:"open",x:s.openUntil(hm(cc))};
}
function hoursText(l,lang){
  var s=S[lang];
  if(l.t==="vc") return s.vcHours(l.d===11?(lang==="es"?"24 oct.":"Oct 24"):(lang==="es"?"31 oct.":"Oct 31"));
  if(l.h==="24") return s.db24;
  return s.dbDaily(hm(l.h[0]),hm(l.h[1]));
}

/* ---------- State ---------- */
var st={lang:"en",type:"all",area:"all",openOnly:false,q:""};
try{var saved=localStorage.getItem("d8vr-lang");if(saved==="es"||saved==="en")st.lang=saved;}catch(e){}

var $=function(id){return document.getElementById(id);};
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
var COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

function renderStatic(){
  var s=S[st.lang], now=nowPT();
  document.documentElement.lang=st.lang;
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=s[el.getAttribute("data-i")];});
  $("lang-en").setAttribute("aria-pressed",st.lang==="en");
  $("lang-es").setAttribute("aria-pressed",st.lang==="es");
  $("q").placeholder=s.q;
  // countdown
  var n=dayDiff(now.date,ED), cd=$("countdown");
  if(n>0) cd.innerHTML="<b>"+n+"</b><span>"+esc(s.daysTo(n))+"</span>";
  else cd.innerHTML="<span>"+esc(n===0&&now.mins<1200?s.edToday:s.edOver)+"</span>";
  $("today").textContent=s.todayIs+fmtDate(now.date,st.lang);
  // dates
  $("dates").innerHTML=DATES.map(function(x){
    var cls=now.date>x.e?"past":(now.date>=x.s?"now":""), tx=x[st.lang];
    var tag=cls==="now"?'<span class="d-tag">'+(x.s===x.e?s.today:s.inProgress)+"</span>":"";
    return '<li class="'+cls+'"><div class="d-when">'+esc(tx[0])+tag+'</div><div class="d-what">'+esc(tx[1])+"</div></li>";
  }).join("");
  $("facts").innerHTML=s.facts.map(function(f){return "<li>"+esc(f)+"</li>";}).join("");
  // chips
  $("typeChips").innerHTML=[["all",s.all],["vc",s.vc],["db",s.db]].map(function(c){
    return '<button type="button" class="chip" data-type="'+c[0]+'" aria-pressed="'+(st.type===c[0])+'">'+esc(c[1])+"</button>";
  }).join("")+'<span class="sep" aria-hidden="true"></span><button type="button" class="chip toggle" id="openOnly" aria-pressed="'+st.openOnly+'">'+esc(s.openNow)+"</button>";
  $("areaChips").innerHTML=[["all",s.allAreas]].concat(AREAS.map(function(a){return [a.id,a[st.lang]];})).map(function(c){
    return '<button type="button" class="chip" data-area="'+c[0]+'" aria-pressed="'+(st.area===c[0])+'">'+esc(c[1])+"</button>";
  }).join("");
  // links
  $("links").innerHTML=LINKS.map(function(k){var t=k[st.lang],u=(st.lang==="es"&&k.ues)?k.ues:k.u;
    return '<a class="link" href="'+u+'" target="_blank" rel="noopener"><b>'+esc(t[0])+"</b><span>"+esc(t[1])+"</span></a>";}).join("");
  $("phones").innerHTML='<div><small>'+esc(s.phonesMain)+'</small><b>(858) 565-5800</b></div><div><small>'+esc(s.phonesToll)+'</small><b>(800) 696-0136</b></div><div><small>Web</small><b>sdvote.com</b></div>';
  $("foot").textContent=s.foot;
}

function renderList(){
  var s=S[st.lang], now=nowPT(), q=st.q.trim().toLowerCase(), total=0;
  var html=AREAS.filter(function(a){return st.area==="all"||st.area===a.id;}).map(function(a){
    var items=L.filter(function(l){
      if(l.a!==a.id) return false;
      if(st.type!=="all"&&l.t!==st.type) return false;
      if(q&&(l.n+" "+l.ad+" "+l.c+" "+l.z+" "+(l.s||"")).toLowerCase().indexOf(q)<0) return false;
      l._s=status(l,now,st.lang);
      if(st.openOnly&&l._s.k!=="open") return false;
      return true;
    });
    // open first, then vote centers before drop boxes
    var rank={open:0,soon:1,closed:2};
    items.sort(function(x,y){return rank[x._s.k]-rank[y._s.k]||(x.t===y.t?0:x.t==="vc"?-1:1);});
    total+=items.length;
    if(!items.length) return "";
    return '<div class="area"><div class="area-h"><h3>'+esc(a[st.lang])+' <span class="note">· '+esc(s.count(items.length))+'</span></h3><p>'+esc(st.lang==="es"?a.subEs:a.subEn)+'</p></div><div class="cards">'+
      items.map(function(l){
        var full=l.ad+", "+l.c+", CA "+l.z, maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(full);
        var note=l.noteEn?'<div class="note">'+esc(st.lang==="es"?l.noteEs:l.noteEn)+"</div>":"";
        var sub=l.s?'<div class="note">'+esc(l.s)+"</div>":"";
        return '<article class="card"><div class="card-top"><span class="type '+l.t+'">'+esc(l.t==="vc"?s.typeVc:s.typeDb)+'</span><span class="status '+l._s.k+'">'+esc(l._s.x)+'</span></div>'+
          '<div class="name">'+esc(l.n)+"</div>"+sub+'<div class="addr">'+esc(full)+"</div>"+note+
          '<div class="hours">'+esc(hoursText(l,st.lang))+"</div>"+
          '<div class="actions"><a class="btn primary" href="'+maps+'" target="_blank" rel="noopener">'+PIN+esc(s.dir)+'</a><button type="button" class="btn" data-copy="'+esc(full)+'">'+COPY+'<span>'+esc(s.copy)+"</span></button></div></article>";
      }).join("")+"</div></div>";
  }).join("");
  $("results").innerHTML=total?html:'<div class="area"><div class="empty">'+esc(s.empty)+"</div></div>";
}

function renderAll(){renderStatic();renderList();}

document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.id==="lang-en"||b.id==="lang-es"){st.lang=b.id.slice(5);try{localStorage.setItem("d8vr-lang",st.lang);}catch(_){}renderAll();return;}
  if(b.dataset.type){st.type=b.dataset.type;renderAll();return;}
  if(b.dataset.area){st.area=b.dataset.area;renderAll();return;}
  if(b.id==="openOnly"){st.openOnly=!st.openOnly;renderAll();return;}
  if(b.dataset.copy){
    var label=b.querySelector("span"), txt=b.dataset.copy, done=function(){label.textContent=S[st.lang].copied;setTimeout(function(){label.textContent=S[st.lang].copy;},1500);};
    var fallback=function(){var a=b.closest(".card").querySelector(".addr"),r=document.createRange();r.selectNodeContents(a);var sel=getSelection();sel.removeAllRanges();sel.addRange(r);};
    try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(_){fallback();}
  }
});
$("q").addEventListener("input",function(e){st.q=e.target.value;renderList();});
renderAll();
setInterval(function(){renderStatic();renderList();},60000);
})();
</script>
